[build-system]
requires = ["setuptools>=64,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "rnfs-nomadnet-gateway"
dynamic = ["version"]
description = "Lets NomadNet users fetch and download rnfs content without running rnfs"
readme = "README.md"
requires-python = ">=3.11"
# rnfs isn't on PyPI: install.sh installs its release wheel first (its public API is provisional until 0.2)
dependencies = ["rns>=1.5.6,<1.6", "rnfs>=0.1.5,<0.2"]
keywords = ["reticulum", "rns", "rnfs", "nomadnet", "gateway"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Communications :: File Sharing",
]

[project.scripts]
rnfs-nomadnet-gateway = "rnfs_nomadnet_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["rnfs_nomadnet_gateway*"]

[tool.setuptools.dynamic]
version = {attr = "rnfs_nomadnet_gateway.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008", "B904"]
